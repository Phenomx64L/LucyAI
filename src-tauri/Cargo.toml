[package]
name = "lucy-svelte"
version = "1.7.101"
description = "Lucy SysAdmin Assistant"
authors = ["Edd Luna"]
edition = "2021"

[lib]
name = "lucy_svelte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Allocator (v1.4.10) ──────────────────────────────────────────────────
# mimalloc replaces the system allocator. Empirical win: 10-30% faster on
# workloads dominated by small allocations (JSON parse, SQLite row reads,
# Markdown render, tokenization). Single line change with zero risk
# because mimalloc is API-compatible with the system allocator.
mimalloc   = { version = "0.1", default-features = false }
tauri      = { version = "2.0.0", features = [] }
serde      = { version = "1",     features = ["derive"] }
serde_json = "1"
reqwest    = { version = "0.12",  features = ["json", "stream"] }
futures-util = "0.3"
async-trait = "0.1"
base64     = "0.22"
rfd        = "0.14"
sysinfo    = "0.30"
keyring    = "2.3"
chrono     = "0.4"
once_cell  = "1"
flate2     = "1"   # gzip compression for rotated logs (already transitive)
# ts-rs: generates TypeScript bindings from #[derive(TS)] structs.
# Run `cargo test --package lucy-svelte export_bindings` to regenerate
# files in `src/lib/types/`. Zero runtime overhead — derive is no-op
# unless the export method is called from a test.
ts-rs = { version = "10", features = ["chrono-impl", "serde-compat"] }
tokio      = { version = "1", features = ["time", "rt", "process", "io-util", "macros"] }
winreg     = "0.52"
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
tauri-plugin-notification = "2"
# v1.4.10 — Window state persistence (Lucy remembers size + position
# + maximized state across launches). Loads silently on app start.
tauri-plugin-window-state = "2"
# v1.4.10 — Single-instance enforcement. If the user double-clicks Lucy
# while a copy is already running, the second invocation focuses the
# existing window AND forwards its argv (so deep links / file
# associations work). Crucial: prevents two processes fighting over the
# SQLite write lock (the 386 MB DB the audit flagged is much more
# likely to corrupt under that scenario).
tauri-plugin-single-instance = "2"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled", "load_extension"] }
# v1.7.93 — sqlite-vec extension. HNSW vector index inside the SAME .db
# file. No separate server, no extra process — just a virtual table type
# we register at boot. Replaces the linear cosine scan for embeddings
# with sub-millisecond ANN.
sqlite-vec = "0.1"
# v1.7.100 — D1 (split-view terminal): cross-platform PTY for the in-app
# xterm.js panel. portable-pty wraps Windows' ConPTY and Unix openpty in
# a single Send+Sync API. We use the master read/write halves directly;
# the child handle is kept alive in our PTY state so the shell process
# doesn't get reaped on a drop chain hiccup.
portable-pty = "0.8"
# P11 audit: connection pool — splits read/write so concurrent readers don't
# serialize through one mutex. r2d2_sqlite 0.24 matches rusqlite 0.31 series.
r2d2 = "0.8"
r2d2_sqlite = "0.24"
ropey = "1.6.1"
aho-corasick = "1.1.4"
similar = "3.0.0"
radix_trie = "0.3.0"
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tiktoken-rs = "0.9.1"
simsearch = "0.3.0"
walkdir = "2.5.0"
urlencoding = "2.1.3"
# ── Cryptographically secure RNG for security tokens ─────────────────────────
rand = "0.8"
# ── PDF Intelligence (Sprint 4 Pillar 4) ─────────────────────────────────────
pdf-extract = "0.7"

# ── LlamaFirewall Phase 2 (May 2026) — ML guardrail ──────────────────────────
# Optional ONNX inference for prompt-injection detection via PromptGuard 2.
# Gated behind the `ml-guard` feature so the default build stays lean (no
# extra ~50MB ORT runtime DLLs, no 280MB model). When the feature is OFF
# the regex-based guardrail bank is still active — ML is *defense in
# depth*, not the only line.
#
# Build with: `cargo build --features ml-guard`
# `load-dynamic` means the ORT DLL is loaded at runtime if present; build
# never tries to bundle binaries, so this feature is build-safe to enable.
ort         = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"], optional = true }
tokenizers  = { version = "0.21", default-features = false, features = ["onig"], optional = true }
ndarray     = { version = "0.16", optional = true }

[features]
default     = []
ml-guard    = ["dep:ort", "dep:tokenizers", "dep:ndarray"]
# Tier 3 #7: cross-encoder reranker (ms-marco-MiniLM-L-6-v2 ONNX).
# Shares the same ORT/tokenizers cone as ml-guard, so enabling both is free.
ml-reranker = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

# ── RDP Computer Use Agent ────────────────────────────────────────────────────
# Win32 APIs for window screenshot + input simulation
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser", "wingdi", "processthreadsapi", "psapi",
    "handleapi", "windef", "minwindef", "errhandlingapi", "winnt",
    "debugapi"
] }
# PNG encoding for screenshots
image = { version = "0.25", default-features = false, features = ["png"] }

# ── ANTI-TAMPERING / HARDENING DEPENDENCIES ──────────────────────────────────
# obfstr: compile-time XOR string obfuscation. Wraps literals so they don't
#         appear in `strings lucy.exe` dumps. Decoded only when accessed at
#         runtime. Used for the system prompt RULES (intellectual property).
# sha2:   self-integrity check at boot — abort if the binary was patched.
[dependencies.obfstr]
version = "0.4"

[dependencies.sha2]
version = "0.10"

# ── RELEASE PROFILE — production binary hardening ────────────────────────────
# Goals (in order of importance for Lucy):
#   1. Smaller binary  → fewer indicators / function names for IDA/Ghidra.
#   2. Aggressive opts → inlining + reordering scrambles control flow.
#   3. Stripped debug  → no symbol names in panic traces.
#   4. Single codegen  → enables full cross-crate inlining.
#
# Trade-off: slower compile time (~2-3× a debug build), but only matters
# when shipping a release. Day-to-day `cargo run` is unaffected.
#
# These flags WILL NOT prevent reverse engineering by a determined attacker.
# They DO raise the cost from "5 min with strings.exe" to "hours with Ghidra
# + manually reconstructing inlined functions".
[profile.release]
opt-level     = "z"      # optimize for size — produces denser, harder-to-read asm
lto           = "fat"    # link-time optimization across ALL crates
codegen-units = 1        # single unit → max inlining (fewer named symbols)
strip         = true     # remove all symbols + debug info from final binary
panic         = "abort"  # no unwinding metadata → no function name trails
incremental   = false    # always full rebuild — no leftover incremental artifacts
overflow-checks = true   # LOGIC-4 FIX: catch integer overflow instead of silent wrapping.
                         # Prevents wrong results from as-casts on file sizes, token counts, PIDs.
debug         = false    # no debug info embedded
debug-assertions = false

# ── PGO PROFILES (v1.7.86) ───────────────────────────────────────────────────
#
# Profile-Guided Optimization: the compiler is given real-workload profile
# data and uses it to make smarter inlining, branch-prediction, and
# register-allocation decisions on Lucy's HOT paths (memory recall, SIMD
# cosine, stream parsing, prompt builder).
#
# Two-stage workflow:
#
#   1. `release-pgo-gen` — instrument the binary so it WRITES profile data
#      to disk during normal use. Slower (~10-20%) and produces a larger
#      binary. Only used during the training run.
#
#   2. `release-pgo-use` — read the merged profile and apply it to a
#      regular release build. Same shape as `release`, but ~5-15% faster
#      on the hot paths.
#
# Run via `scripts/build-pgo.ps1` (see that file for the full cycle).
#
# Why opt-out via a separate profile vs editing [profile.release]:
# the dev/build workflows (cargo run, tauri dev) shouldn't pay PGO's
# costs. Operators who don't generate profiles still get the standard
# release; the PGO profile is for the release-pipeline operator only.

[profile.release-pgo-gen]
inherits         = "release"
codegen-units    = 16       # parallel build during instrumented training
lto              = "thin"   # full LTO interacts oddly with PGO codegen

[profile.release-pgo-use]
inherits         = "release"
codegen-units    = 1        # standard release tuning during the optimized build
lto              = "fat"
