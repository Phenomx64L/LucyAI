# ── Cargo config ─────────────────────────────────────────────────────────────
#
# `--test-threads=1` is a hard requirement of this suite, not a preference. The
# shell contract tests spawn real `powershell.exe` processes; under parallelism
# the Windows console host injects variable \r\n padding into their output and
# occasionally blows the per-test timeout. Several other tests take a census of
# `%TEMP%` — a process-global directory — so a sibling staging a file mid-test
# lands in the wrong assertion.
#
# Both `.githooks/pre-commit` and `.github/workflows/ci.yml` pass the flag, and
# both explain why. Nothing enforced it for a plain `cargo test`, which is what
# a developer actually types: the suite came back red with failures that said
# nothing about the code, and the flag is not something you can guess from the
# output. `RUST_TEST_THREADS` is libtest's own knob and applies wherever the
# harness runs, so the default is now correct and the flag in the hook and in
# CI becomes belt-and-braces rather than the only thing standing between you
# and a confusing failure.
#
# If you ever want the parallel run back for a one-off: `RUST_TEST_THREADS=8
# cargo test` overrides this, since `[env]` here is not `force = true` and a
# real environment variable wins over it. Verified — with 8 the two %TEMP%
# census tests go red again, which is the point. Do NOT use `0`: libtest does
# not read it as "one per core", it panics in `concurrency.rs`.
[env]
RUST_TEST_THREADS = "1"
